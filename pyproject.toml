[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iconic-bpm-bpmmer"
version = "1.0.0"
description = "Ultimate BPM & tempo analyser with time-signature detection, section analysis, DAW export, and BPM normalisation"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "flask>=2.3.0",
    "librosa>=0.10.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "soundfile>=0.12.0",
    "pydub>=0.25.1",
    "mido>=1.3.0",
    "mutagen>=1.46.0",
    "scikit-learn>=1.2.0",
    "resampy>=0.4.2",
    "numba>=0.57.0",
    "audioread>=3.0.0",
]

[project.scripts]
bpmmer = "app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["analyzer*"]
